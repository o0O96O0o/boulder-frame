name: boulder-frame

x-application-environment: &application-environment
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  SIGNED_URL_TTL: ${SIGNED_URL_TTL}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
  MODEL_DIR: ${MODEL_DIR:-/models}
  MODEL_VERSION: ${MODEL_VERSION}
  PIPELINE_VERSION: ${PIPELINE_VERSION}
  WORKER_ID: ${WORKER_ID}

services:
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: boulder-frame/frontend:local
    environment:
      API_BASE_URL: ${API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    networks:
      - private
      - edge
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: boulder-frame/backend:local
    env_file: .env
    environment:
      <<: *application-environment
      API_BASE_URL: ${API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
      DETECTION_SAMPLE_FPS: ${DETECTION_SAMPLE_FPS:-10}
      DEVELOPMENT_OWNER: ${DEVELOPMENT_OWNER:-development-owner}
    volumes:
      - ./backend:/workspace/backend
    ports:
      - "8080:8080"
    networks:
      - private
      - edge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    image: boulder-frame/worker:local
    env_file: .env
    environment:
      <<: *application-environment
      WORKER_SCRATCH_ROOT: ${WORKER_SCRATCH_ROOT:-/work}
      WORKER_RETAIN_DEBUG_ARTIFACTS: ${WORKER_RETAIN_DEBUG_ARTIFACTS:-true}
      WORKER_DEBUG_CAPTURE: ${WORKER_DEBUG_CAPTURE:-true}
      WORKER_DEBUG_VISUAL_CAPTURE: ${WORKER_DEBUG_VISUAL_CAPTURE:-true}
      WORKER_DEBUG_REQUIRE_PRIVATE_STORAGE: ${WORKER_DEBUG_REQUIRE_PRIVATE_STORAGE:-false}
    volumes:
      - ./worker:/workspace/worker
      - ${MODEL_DIR_HOST:-./worker/models}:${MODEL_DIR:-/models}:ro
      - worker-scratch:/work
    networks:
      - private
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; os.kill(1, 0)" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  private:
  edge:

volumes:
  frontend-node-modules:
  worker-scratch:
