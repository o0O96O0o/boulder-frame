name: boulder-frame

x-application-environment: &application-environment
  APP_ENV: ${APP_ENV}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  SIGNED_URL_TTL: ${SIGNED_URL_TTL}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
  MODEL_VERSION: ${MODEL_VERSION}
  PIPELINE_VERSION: ${PIPELINE_VERSION}
  WORKER_ID: ${WORKER_ID}

services:
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: boulder-frame/frontend:local
    environment:
      API_BASE_URL: ${API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - private
      - edge
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: boulder-frame/backend:local
    environment:
      <<: *application-environment
      API_BASE_URL: ${API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
    volumes:
      - ./backend:/workspace/backend
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - private
      - edge
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    image: boulder-frame/worker:local
    environment: *application-environment
    command: [ "boulder-frame-worker", "--config", "/workspace/worker/conf/config.dev.json", "--serve" ]
    volumes:
      - ./worker:/workspace/worker
      - worker-scratch:/work
    networks:
      - private
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; os.kill(1, 0)" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  private:
  edge:

volumes:
  frontend-node-modules:
  worker-scratch:
