[build-system]
requires = ["setuptools>=75.8"]
build-backend = "setuptools.build_meta"

[project]
name = "boulder-frame-worker"
version = "0.1.0"
description = "Offline Boulder Frame media worker foundation"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.35.99",
    "numpy==1.26.4",
    "onnxruntime==1.22.0",
    "opencv-python-headless==4.10.0.84",
    "psycopg[binary]==3.2.10",
    "redis==5.2.1",
]

[project.scripts]
boulder-frame-worker = "boulder_frame_worker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
