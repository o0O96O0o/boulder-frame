name: boulder-frame

x-application-environment: &application-environment
  APP_ENV: ${APP_ENV}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  SIGNED_URL_TTL: ${SIGNED_URL_TTL}
  ASSET_RETENTION_DAYS: ${ASSET_RETENTION_DAYS}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
  MODEL_VERSION: ${MODEL_VERSION}
  PIPELINE_VERSION: ${PIPELINE_VERSION}

services:
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    image: boulder-frame/frontend:local
    environment:
      API_BASE_URL: ${API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
    volumes:
      - ../frontend:/workspace/frontend
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    image: boulder-frame/backend:local
    environment:
      <<: *application-environment
      API_BASE_URL: ${API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
    volumes:
      - ../backend:/workspace/backend
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    image: boulder-frame/worker:local
    environment: *application-environment
    command: ["boulder-frame-worker", "--config", "/workspace/worker/conf/config.dev.json", "--serve"]
    volumes:
      - ../worker:/workspace/worker
      - worker-scratch:/work
    networks:
      - private
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - objectstore-data:/data
    networks:
      - private
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  objectstore-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ASSET_RETENTION_DAYS: ${ASSET_RETENTION_DAYS}
    volumes:
      - ./minio-lifecycle.json.template:/config/minio-lifecycle.json.template:ro
      - ./minio-cors.json:/config/minio-cors.json:ro
    networks:
      - private
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://objectstore:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc admin user info local "$${S3_ACCESS_KEY}" >/dev/null 2>&1 || mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc admin policy attach local readwrite --user "$${S3_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        sed "s/__ASSET_RETENTION_DAYS__/$${ASSET_RETENTION_DAYS}/g" /config/minio-lifecycle.json.template > /tmp/lifecycle.json
        mc ilm import "local/$${S3_BUCKET}" < /tmp/lifecycle.json
        mc cors set "local/$${S3_BUCKET}" /config/minio-cors.json
    restart: "no"

networks:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  worker-scratch:
  caddy-data:
  caddy-config:
