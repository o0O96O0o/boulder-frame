services:
  frontend:
    profiles: ["online"]
    build: !reset null
    image: ${FRONTEND_IMAGE}
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    environment:
      API_BASE_URL: /
      WEB_BASE_URL: https://${CADDY_DOMAIN}
    command: ["/bin/sh", "-ec", "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --mode production"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  backend:
    profiles: ["online"]
    build: !reset null
    image: ${BACKEND_IMAGE}
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    environment:
      APP_ENV: online
      API_BASE_URL: https://${CADDY_DOMAIN}
      WEB_BASE_URL: https://${CADDY_DOMAIN}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  worker:
    profiles: ["online"]
    build: !reset null
    image: ${WORKER_IMAGE}
    volumes: !reset
      - worker-scratch:/work
    restart: unless-stopped
    environment:
      APP_ENV: online
      WORKER_CONCURRENCY: "1"
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 6G

  postgres:
    profiles: ["online"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  redis:
    profiles: ["online"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  objectstore:
    profiles: ["online"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
    ports: !reset []

  objectstore-init:
    profiles: ["online"]

  caddy:
    profiles: ["online"]
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
